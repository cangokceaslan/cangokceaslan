name: Update contribution area

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-area
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate contribution area
        run: node scripts/generate-contribution-area.mjs

      - name: Commit updated graph
        run: |
          if git diff --quiet -- assets/github-insights/contribution-area.svg; then
            echo "Contribution graph is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-insights/contribution-area.svg
          git commit -m "Update contribution area graph"
          git push
